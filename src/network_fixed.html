let currentTime = 0;

function resetEdges() {
    let edges = network.body.data.edges;
    edges.get().forEach(e => {
        edges.update({id: e.id, color:"#95a5a6", width:1});
    });
}

function highlight(from, to, color) {
    let id = edgeMap[from+","+to];
    if (id !== undefined) {
        network.body.data.edges.update({id:id, color:color, width:3});
    }
}

function update(t) {
    resetEdges();

    let events = timelineData[t] || [];

    for (let e of events) {
        let c = "#3498db";
        if (e.category === "threat") c = "#e74c3c";
        highlight(e.from, e.to, c);
    }

    document.getElementById("timeLabel").innerText = "t=" + t;
}

function play() {
    setInterval(() => {
        if (currentTime >= 1) return;
        currentTime++;
        update(currentTime);
    }, 600);
}
